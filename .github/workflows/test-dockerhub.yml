name: 测试 Docker Hub 登录

on:
  workflow_dispatch:

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: 测试 Secrets 是否存在
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "❌ DOCKERHUB_USERNAME 不存在或为空"
          else
            echo "✓ DOCKERHUB_USERNAME 已配置，长度: ${#USERNAME}"
          fi
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
