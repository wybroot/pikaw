name: 测试 Docker Hub 登录

on:
  workflow_dispatch:  # 手动触发

jobs:
  test-login:
    runs-on: ubuntu-latest
    steps:
      - name: 输出 Secrets 信息（脱敏）
        run: |
          echo "DOCKERHUB_USERNAME 长度: ${#DOCKERHUB_USERNAME}"
          echo "DOCKERHUB_PASSWORD 长度: ${#DOCKERHUB_PASSWORD}"
          echo "DOCKERHUB_USERNAME 首字符: ${DOCKERHUB_USERNAME:0:1}"
          echo "DOCKERHUB_USERNAME 尾字符: ${DOCKERHUB_USERNAME: -1}"
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: 尝试登录 Docker Hub (用户名)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
